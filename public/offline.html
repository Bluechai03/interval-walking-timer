<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>No signal · Strut</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; background: #050b16; color: #f4f6f8; font: 18px/1.4 system-ui, -apple-system, sans-serif; }
  main { max-width: 28rem; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 2rem; line-height: 1.1; }
  p { margin: 0; color: #a9b7ca; }
  a { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 8px; background: #f4f6f8; color: #050b16; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 3px solid #f4f6f8; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>No signal right now</h1>
  <p>Walking with friends needs a signal to keep everyone in step. The timer works without one, so you can still start your walk.</p>
  <a href="/">Back to the timer</a>
</main>

</html>
